apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/kashyapjanve7/ci-cd-final-project.git
    - name: app-name
      type: string
      default: ci-cd-final-project
    - name: build-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-kashyapjanve/ci-cd-final-project:latest
  workspaces:
    - name: output
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: output
    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      runAfter:
        - cleanup
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: main
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: output
    - name: flake8-lint
      taskRef:
        name: flake8
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: output
    - name: nose-tests
      taskRef:
        name: nose
      runAfter:
        - flake8-lint
      params:
        - name: args
          value: "-v"
      workspaces:
        - name: source
          workspace: output
    - name: buildah
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter:
        - nose-tests
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: "false"
        - name: FORMAT
          value: docker
      workspaces:
        - name: source
          workspace: output
    - name: deploy
      taskRef:
        name: openshift-client
        kind: ClusterTask
      runAfter:
        - buildah
      params:
        - name: SCRIPT
          value: oc create deployment $(params.app-name) --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -
